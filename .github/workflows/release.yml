name: Release

# Publishes a GitHub Release every time a PR is merged into main.
# Version is an automatic patch bump of the latest v-prefixed tag (seeded at v0.1.0).
# Artifacts: a zipped universal .app and a .dmg, built with build-app.sh. The host
# links only RadioPluginKit, so the build is standalone (no sibling checkout).

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decide whether this event should produce a release. A merged PR (or a push to main)
  # that ONLY changes documentation is skipped; tag pushes and manual dispatch always release.
  gate:
    name: Decide whether to release (skip docs-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This workflow only triggers on pull_request — list the PR's changed files.
          files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" -q '.[].filename')"
          echo "Changed files:"; printf '  %s\n' "$files"
          # Docs-only when EVERY changed file is markdown, under docs/, or LICENSE.
          skip=true
          [ -z "$files" ] && skip=false   # unknown/empty diff -> release, don't skip
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|*/docs/*|LICENSE) : ;;
              *) skip=false; break ;;
            esac
          done <<< "$files"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          [ "$skip" = true ] && echo "::notice::Docs-only change — skipping release."

  release:
    needs: gate
    # Only on an actual merge — closing a PR without merging must not release.
    # Also skip when the merge only touched docs (see the gate job).
    if: github.event.pull_request.merged == true && needs.gate.outputs.skip != 'true'
    name: Build & publish release (macOS 14)
    runs-on: macos-14
    steps:
      - name: Check out merged main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Compute next version (patch bump)
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            ver=${latest#v}
            IFS=. read -r MA MI PA <<< "$ver"
            next="v${MA}.${MI}.$((PA + 1))"
          fi
          echo "Latest: ${latest:-<none>} -> Next: $next"
          echo "tag=$next"            >> "$GITHUB_OUTPUT"
          echo "version=${next#v}"    >> "$GITHUB_OUTPUT"

      - name: Build signed + notarized host (RadioSuiteHost) .zip and .dmg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          # Signing/notarization secrets (see docs/SIGNING-SECRETS.md). When unset, the script
          # falls back to ad-hoc and skips notarization — the build still succeeds, but the
          # released Suite can't host third-party extensions on another Mac.
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ./scripts/package-host-signed.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "Amateur Radio Suite ${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.event.pull_request.base.ref }}" \
            "AmateurRadioSuite-${{ steps.ver.outputs.version }}.zip" \
            "AmateurRadioSuite-${{ steps.ver.outputs.version }}.dmg"
